<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#5b3a29">
  <title>Café &amp; Dulce · Menú</title>
  <meta name="description" content="Menú digital de Café & Dulce: cafés, medialunas, cookies, tortas y combos, con precios y disponibilidad.">
  <link rel="icon" href="img/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="encabezado">
    <img class="logo" src="img/logo.svg" width="64" height="64" alt="">
    <h1 id="nombre-negocio">Café &amp; Dulce</h1>
    <p id="frase-negocio" class="frase">Café de especialidad y pastelería artesanal.</p>
  </header>

  <div class="barra">
    <div class="barra-interna">
      <label class="buscador">
        <span class="solo-lectores">Buscar producto por nombre</span>
        <svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16.5 16.5 21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="buscador" type="search" placeholder="Buscar en el menú…" autocomplete="off" enterkeyhint="search">
      </label>
      <nav aria-label="Categorías">
        <ul id="categorias" class="categorias"></ul>
      </nav>
    </div>
  </div>

  <main>
    <p id="resumen" class="resumen" role="status" aria-live="polite"></p>
    <ul id="productos" class="grilla"></ul>
    <div id="vacio" class="vacio" hidden>
      <p id="vacio-mensaje"></p>
      <button id="vacio-limpiar" type="button" class="boton-limpiar">Ver todo el menú</button>
    </div>
    <p id="error" class="vacio" hidden></p>
    <noscript><p class="vacio">Necesitás activar JavaScript para ver el menú.</p></noscript>
  </main>

  <footer class="pie">
    <p id="actualizado"></p>
    <p>Los precios y la disponibilidad pueden cambiar durante el día.<br>Consultá en el puesto.</p>
  </footer>

  <!-- Orden importante: datos primero, luego la lógica y por último la interfaz. -->
  <script src="data/config.js"></script>
  <script src="data/productos.js"></script>
  <script src="js/stock.js"></script>
  <script src="js/catalogo.js"></script>
  <script src="js/datos.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
